name: Lint and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Verify package installs
        run: pip install ./packages/data-structures

      - name: Verify package import
        run: python -c "from lazypye.data_structures import SinglyLinkedList"

      - name: Run tests
        run: pytest