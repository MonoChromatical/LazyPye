[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazypye-data-structures"
version = "0.1.0"
description = "Data structure utilities from LazyPye"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lazypye*"]