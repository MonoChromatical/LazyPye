[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazypye-linked-lists"
version = "0.1.1"
description = "Linked list data structures from LazyPye"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lazypye*"]